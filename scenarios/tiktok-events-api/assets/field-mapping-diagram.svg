<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Shopify to TikTok Events API field mapping with SHA-256 hashing">
<title>Shopify to TikTok Events API field mapping</title>
<desc>The Shopify orders/paid webhook payload maps through a Make.com transform layer to the TikTok Events API. Email and phone are SHA-256 hashed; event and value fields pass through in plaintext.</desc>
<style>
  text { fill: #1f2328; }
  .sub { fill: #656d76; }
  .hashfill { fill: #fff1e5; stroke: #bc4c00; }
  .passfill { fill: #dafbe1; stroke: #1a7f37; }
  .piifill  { fill: #ffebe9; stroke: #cf222e; }
  .neutral  { fill: #f6f8fa; stroke: #d0d7de; }
  .ttfill   { fill: #ddf4ff; stroke: #0969da; }
  line { stroke: #8c959f; stroke-width: 1.2; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; } .sub { fill: #8b949e; }
    .hashfill { fill: #271810; stroke: #db6d28; }
    .passfill { fill: #0f2417; stroke: #2ea043; }
    .piifill  { fill: #2d1313; stroke: #f85149; }
    .neutral  { fill: #161b22; stroke: #30363d; }
    .ttfill   { fill: #0c2d4a; stroke: #388bfd; }
    line { stroke: #6e7681; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="100" y="28" text-anchor="middle" font-weight="500" font-size="14">Shopify webhook</text>
<text x="100" y="44" text-anchor="middle" font-size="12" class="sub">orders/paid</text>
<text x="340" y="28" text-anchor="middle" font-weight="500" font-size="14">Make.com transform</text>
<text x="340" y="44" text-anchor="middle" font-size="12" class="sub">HTTP module</text>
<text x="580" y="28" text-anchor="middle" font-weight="500" font-size="14">TikTok Events API</text>
<text x="580" y="44" text-anchor="middle" font-size="12" class="sub">CompletePayment</text>

<rect x="30" y="70" width="140" height="40" rx="6" class="piifill" stroke-width="1"/>
<text x="100" y="88" text-anchor="middle" font-weight="500" font-size="14">email</text>
<text x="100" y="103" text-anchor="middle" font-size="11" class="sub">PII</text>
<rect x="30" y="120" width="140" height="40" rx="6" class="piifill" stroke-width="1"/>
<text x="100" y="138" text-anchor="middle" font-weight="500" font-size="14">phone</text>
<text x="100" y="153" text-anchor="middle" font-size="11" class="sub">PII</text>
<rect x="30" y="170" width="140" height="34" rx="6" class="neutral" stroke-width="1"/>
<text x="100" y="191" text-anchor="middle" font-weight="500" font-size="14">total_price</text>
<rect x="30" y="214" width="140" height="34" rx="6" class="neutral" stroke-width="1"/>
<text x="100" y="235" text-anchor="middle" font-weight="500" font-size="14">currency</text>
<rect x="30" y="258" width="140" height="34" rx="6" class="neutral" stroke-width="1"/>
<text x="100" y="279" text-anchor="middle" font-weight="500" font-size="14">id</text>
<rect x="30" y="302" width="140" height="34" rx="6" class="neutral" stroke-width="1"/>
<text x="100" y="323" text-anchor="middle" font-weight="500" font-size="14">line_items[]</text>

<rect x="270" y="120" width="140" height="60" rx="8" class="hashfill" stroke-width="1.5"/>
<text x="340" y="146" text-anchor="middle" font-weight="500" font-size="14">SHA-256 hash</text>
<text x="340" y="164" text-anchor="middle" font-size="11" class="sub">email, phone only</text>
<rect x="270" y="238" width="140" height="60" rx="8" class="passfill" stroke-width="1"/>
<text x="340" y="264" text-anchor="middle" font-weight="500" font-size="14">pass-through</text>
<text x="340" y="282" text-anchor="middle" font-size="11" class="sub">value, id, items</text>

<rect x="510" y="120" width="140" height="60" rx="6" class="piifill" stroke-width="1"/>
<text x="580" y="146" text-anchor="middle" font-weight="500" font-size="14">user.email</text>
<text x="580" y="164" text-anchor="middle" font-weight="500" font-size="14">user.phone</text>
<rect x="510" y="220" width="140" height="44" rx="6" class="ttfill" stroke-width="1"/>
<text x="580" y="240" text-anchor="middle" font-weight="500" font-size="14">properties.value</text>
<text x="580" y="256" text-anchor="middle" font-size="11" class="sub">+ currency</text>
<rect x="510" y="274" width="140" height="44" rx="6" class="ttfill" stroke-width="1"/>
<text x="580" y="294" text-anchor="middle" font-weight="500" font-size="14">event_id</text>
<text x="580" y="310" text-anchor="middle" font-size="11" class="sub">pixel dedup</text>

<line x1="170" y1="90" x2="266" y2="135" marker-end="url(#arrow)"/>
<line x1="170" y1="140" x2="266" y2="150" marker-end="url(#arrow)"/>
<line x1="170" y1="187" x2="266" y2="258" marker-end="url(#arrow)"/>
<line x1="170" y1="231" x2="266" y2="268" marker-end="url(#arrow)"/>
<line x1="170" y1="275" x2="266" y2="278" marker-end="url(#arrow)"/>
<line x1="170" y1="319" x2="266" y2="288" marker-end="url(#arrow)"/>
<line x1="410" y1="150" x2="506" y2="150" marker-end="url(#arrow)"/>
<line x1="410" y1="262" x2="506" y2="242" marker-end="url(#arrow)"/>
<line x1="410" y1="278" x2="506" y2="296" marker-end="url(#arrow)"/>

<rect x="30" y="370" width="620" height="74" rx="8" class="neutral" stroke-width="1"/>
<text x="50" y="396" font-weight="500" font-size="14">Two things people get wrong</text>
<text x="50" y="416" font-size="12" class="sub">1 · Set the HTTP body to Key-value (Map mode) or the sha256() expressions send as literal text.</text>
<text x="50" y="434" font-size="12" class="sub">2 · Send event_id matching your browser pixel so TikTok deduplicates — run both, not one.</text>
</svg>
